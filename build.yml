name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.manikganjpolice --project-name manikganj_police _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp

      - name: Patch AndroidManifest (internet permission + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' $M
          sed -i 's/android:label="[^"]*"/android:label="Manikganj Police"/' $M
          cat $M

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manikganj-Police-APK
          path: build/app/outputs/flutter-apk/app-release.apk
